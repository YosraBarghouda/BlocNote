<!-- Navbar with title, logo, and Home button -->
<nav class="navbar">
  <a href="/" class="logo">
    <img src="/assets/logo.jpg" alt="Logo">
    <h1>Website Title</h1>
  </a>
  <div class="navbar-links">
    <a href="/home" class="nav-button">Home</a>
  </div>
</nav>
<div class="note-edit-container">
  <h2>Create a New Note</h2>
  <form (ngSubmit)="onSave()">
    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" id="title" [(ngModel)]="title" name="title" required>
    </div>
    <div class="form-group">
      <label for="content">Content:</label>
      <textarea id="content" [(ngModel)]="content" name="content" rows="10" required></textarea>
    </div>
    <button type="submit">Save Note</button>
  </form>
</div>
<style>
    .note-edit-container {
    background-image: url('assets/back.jpg'); 
  }
</style>
