<div class="all">
  <div class="profile-container">
    <h2>Your Profile</h2>

    <!-- Profile Picture Section -->
    <div class="user-picture-upload">
      <img *ngIf="previewImage" [src]="previewImage" alt="Profile Preview" class="preview-image" />
      <label for="picture" class="upload-label">Upload Picture</label>
      <input type="file" id="picture" (change)="onFileSelected($event)" />
    </div>

    <!-- Profile Form -->
    <form (ngSubmit)="onSave()">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="new-password">New Password:</label>
        <input type="password" id="new-password" [(ngModel)]="newPassword" name="newPassword" />
        <small>Leave blank to keep the current password.</small>
      </div>

      <div class="form-group">
        <label for="bio">Bio:</label>
        <textarea id="bio" [(ngModel)]="bio" name="bio" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="nb_notes">Number of Notes:</label>
        <input type="number" id="nb_notes" [(ngModel)]="nb_notes" name="nb_notes" readonly />
      </div>

      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>
